schemaVersion: provision.dev/v1alpha1
kind: Environment
name: lab
application: provision-example-key-value-http
rollbackWindow: 30m0s
targets:
  base:
    kind: host
    address: base.local
    user: marlinf
implementations:
  sessions:
    kind: valkey-quadlet
    target: base
    lifecycle: managed
    credential: secret://lab/valkey-url
    rollout: required
  web:
    kind: systemd
    target: base
    rollout: required
    endpoint:
      port: 18080
      drain:
        mode: bounded-http
        maxDuration: 2s
