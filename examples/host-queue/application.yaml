schemaVersion: provision.dev/v1alpha1
kind: Application
name: provision-example-queue
components:
  messages:
    role: queue
    queue:
      delivery: at-least-once
      acknowledgement: manual
      publisherConfirm: required
      retry: bounded-redelivery-3
      deadLetter: required
      retention: 24h0m0s
      ordering: unqualified
      deduplication: unqualified
